name: Render video

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - "hyperframes.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          echo "HYPERFRAMES_BROWSER_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Check composition
        run: npm run check

      - name: Render MP4
        run: npm run render -- . --output out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error
