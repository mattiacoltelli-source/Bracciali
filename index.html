<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070a12; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070a12; font-family: "Inter", sans-serif; color: #fff; }
      .scene { position: absolute; inset: 0; overflow: hidden; background: #070a12; }
      .fade { position: absolute; inset: 0; }
      .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
      .g1 { width: 800px; height: 800px; left: -300px; top: 150px; background: rgba(56,160,230,0.28); }
      .g2 { width: 700px; height: 700px; right: -300px; top: 850px; background: rgba(255,150,70,0.20); }
      .phone { position: absolute; left: 249px; top: 190px; width: 582px; height: 1300px; border-radius: 64px; padding: 12px; background: #1b2336; box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 2px #2c3852; }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #0a0e18; }
      .scr { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .shade { position: absolute; left: 0; width: 100%; }
      .shade-bottom { bottom: 0; height: 520px; background: linear-gradient(to top, rgba(7,10,18,0.95), rgba(7,10,18,0)); }
      .bar { width: 96px; height: 10px; border-radius: 5px; background: linear-gradient(90deg,#4fb8ff,#ff9f4d); margin-bottom: 24px; }
      .cap { position: absolute; left: 72px; right: 72px; bottom: 300px; }
      .cap h2 { font-size: 76px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.06; text-shadow: 0 4px 24px rgba(0,0,0,0.5); }
      .logo { font-weight: 700; letter-spacing: -0.03em; background: linear-gradient(90deg,#4fc3ff 0%,#8fd0ff 40%,#ffb066 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .intro { position: absolute; left: 0; right: 0; top: 50%; margin-top: -260px; text-align: center; }
      .intro .emoji { font-size: 1px; }
      .intro h1 { font-size: 170px; line-height: 1.05; }
      .intro p { margin-top: 36px; font-size: 56px; font-weight: 600; color: #aeb9cf; }
      .outro-h { position: absolute; left: 72px; right: 72px; top: 1330px; text-align: center; }
      .outro-h h1 { font-size: 150px; line-height: 1.05; }
      .outro-h p { margin-top: 24px; font-size: 54px; font-weight: 600; color: #cfd8ea; }
      .phone.small { left: 316px; top: 120px; width: 448px; height: 1000px; border-radius: 52px; padding: 10px; }
      .phone.small .screen { border-radius: 42px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.6" data-width="1080" data-height="1920">
      <div id="s-intro" class="clip scene" data-start="0" data-duration="3.6" data-track-index="1">
        <div id="s-intro-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-intro-txt" class="intro">
            <h1 class="logo">CineFighi</h1>
            <p>Film e serie TV, insieme</p>
          </div>
        </div>
      </div>
      <div id="s-home" class="clip scene" data-start="3.1" data-duration="3.5" data-track-index="2">
        <div id="s-home-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-home-ph" class="phone"><div class="screen"><img class="scr" src="assets/app/home.jpg" alt="" /></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-home-cap" class="cap"><div class="bar"></div><h2>Cerca ogni film e serie TV</h2></div>
        </div>
      </div>
      <div id="s-dett" class="clip scene" data-start="6.1" data-duration="3.5" data-track-index="1">
        <div id="s-dett-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-dett-ph" class="phone"><div class="screen"><img class="scr" src="assets/app/dettaglio.jpg" alt="" /></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-dett-cap" class="cap"><div class="bar"></div><h2>Vota e confronta<br>con il gruppo</h2></div>
        </div>
      </div>
      <div id="s-class" class="clip scene" data-start="9.1" data-duration="5.0" data-track-index="2">
        <div id="s-class-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-class-ph" class="phone"><div class="screen"><video id="v-class" class="scr" src="assets/app/stats-classifica.mp4" muted playsinline data-start="9.1" data-duration="5.0" data-track-index="4"></video></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-class-cap" class="cap"><div class="bar"></div><h2>La classifica<br>del gruppo</h2></div>
        </div>
      </div>
      <div id="s-gen" class="clip scene" data-start="13.6" data-duration="5.0" data-track-index="1">
        <div id="s-gen-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-gen-ph" class="phone"><div class="screen"><video id="v-gen" class="scr" src="assets/app/stats-generi.mp4" muted playsinline data-start="13.6" data-duration="5.0" data-track-index="3"></video></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-gen-cap" class="cap"><div class="bar"></div><h2>I generi<br>più votati</h2></div>
        </div>
      </div>
      <div id="s-dna" class="clip scene" data-start="18.1" data-duration="6.5" data-track-index="2">
        <div id="s-dna-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-dna-ph" class="phone"><div class="screen"><video id="v-dna" class="scr" src="assets/app/dna.mp4" muted playsinline data-start="18.1" data-duration="6.5" data-track-index="4"></video></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-dna-cap" class="cap"><div class="bar"></div><h2>Il DNA del gruppo:<br>la mappa dei gusti</h2></div>
        </div>
      </div>
      <div id="s-rep" class="clip scene" data-start="24.1" data-duration="5.0" data-track-index="1">
        <div id="s-rep-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-rep-ph" class="phone"><div class="screen"><video id="v-rep" class="scr" src="assets/app/report-profilo.mp4" muted playsinline data-start="24.1" data-duration="5.0" data-track-index="3"></video></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-rep-cap" class="cap"><div class="bar"></div><h2>Il tuo profilo,<br>scritto da Claude</h2></div>
        </div>
      </div>
      <div id="s-tit" class="clip scene" data-start="28.6" data-duration="4.5" data-track-index="2">
        <div id="s-tit-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-tit-ph" class="phone"><div class="screen"><video id="v-tit" class="scr" src="assets/app/report-titoli.mp4" muted playsinline data-start="28.6" data-duration="4.5" data-track-index="4"></video></div></div>
          <div class="shade shade-bottom"></div>
          <div id="s-tit-cap" class="cap"><div class="bar"></div><h2>10 titoli per te</h2></div>
        </div>
      </div>
      <div id="s-outro" class="clip scene" data-start="32.6" data-duration="4.0" data-track-index="2">
        <div id="s-outro-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-outro-ph" class="phone small"><div class="screen"><img class="scr" src="assets/app/login.jpg" alt="" /></div></div>
          <div id="s-outro-txt" class="outro-h">
            <h1 class="logo">CineFighi</h1>
            <p>Chi sei tu? Entra e vota.</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s-intro-txt",{opacity:0,y:50,scale:0.96},{opacity:1,y:0,scale:1,duration:0.9,ease:"power3.out"},0.2);
      tl.fromTo("#s-home-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},3.1);
      tl.fromTo("#s-home-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:3.5,ease:"none",transformOrigin:"50% 50%"},3.1);
      tl.fromTo("#s-home-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},3.5);
      tl.fromTo("#s-dett-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},6.1);
      tl.fromTo("#s-dett-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:3.5,ease:"none",transformOrigin:"50% 50%"},6.1);
      tl.fromTo("#s-dett-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},6.5);
      tl.fromTo("#s-class-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},9.1);
      tl.fromTo("#s-class-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:5.0,ease:"none",transformOrigin:"50% 50%"},9.1);
      tl.fromTo("#s-class-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},9.5);
      tl.fromTo("#s-gen-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},13.6);
      tl.fromTo("#s-gen-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:5.0,ease:"none",transformOrigin:"50% 50%"},13.6);
      tl.fromTo("#s-gen-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},14.0);
      tl.fromTo("#s-dna-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},18.1);
      tl.fromTo("#s-dna-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:6.5,ease:"none",transformOrigin:"50% 50%"},18.1);
      tl.fromTo("#s-dna-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},18.5);
      tl.fromTo("#s-rep-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},24.1);
      tl.fromTo("#s-rep-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:5.0,ease:"none",transformOrigin:"50% 50%"},24.1);
      tl.fromTo("#s-rep-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},24.5);
      tl.fromTo("#s-tit-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},28.6);
      tl.fromTo("#s-tit-ph",{scale:1.0,y:40},{scale:1.035,y:0,duration:4.5,ease:"none",transformOrigin:"50% 50%"},28.6);
      tl.fromTo("#s-tit-cap",{opacity:0,y:30},{opacity:1,y:0,duration:0.6,ease:"power2.out"},29.0);
      tl.fromTo("#s-outro-fade",{opacity:0},{opacity:1,duration:0.5,ease:"power1.inOut"},32.6);
      tl.fromTo("#s-outro-ph",{scale:1.0,y:40},{scale:1.03,y:0,duration:4.0,ease:"none",transformOrigin:"50% 50%"},32.6);
      tl.fromTo("#s-outro-txt",{opacity:0,y:40},{opacity:1,y:0,duration:0.8,ease:"power3.out"},33.0);
      tl.to("#s-outro-fade",{opacity:0,duration:0.5,ease:"power1.in"},36.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
