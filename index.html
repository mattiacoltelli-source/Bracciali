<!doctype html>

  <head>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .fade { position: absolute; inset: 0; }
      .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .bgblur { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .land { position: absolute; left: 0; top: 656px; width: 1080px; height: 608px; object-fit: cover; }
      .shade { position: absolute; left: 0; width: 100%; }
      .shade-bottom { bottom: 0; height: 760px; background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0)); }
      .shade-full { top: 0; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.25) 55%, rgba(0,0,0,0.1) 100%); }
      .shade-dark { top: 0; height: 100%; background: rgba(8,8,9,0.72); }
      .bar { width: 96px; height: 10px; border-radius: 5px; background: #ff8a3d; margin-bottom: 28px; }
      .cap { position: absolute; left: 72px; right: 72px; bottom: 330px; }
      .cap h2 { font-size: 88px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; text-shadow: 0 4px 24px rgba(0,0,0,0.45); }
      .intro { position: absolute; left: 72px; right: 72px; bottom: 380px; }
      .intro h1 { font-size: 112px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; text-shadow: 0 4px 28px rgba(0,0,0,0.5); }
      .intro p { margin-top: 28px; font-size: 48px; font-weight: 600; color: #f1f1f2; }
      .outro { position: absolute; left: 72px; right: 72px; top: 50%; margin-top: -170px; }
      .outro h1 { font-size: 118px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; }
      .outro p { margin-top: 28px; font-size: 52px; font-weight: 600; color: #e4e4e6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.5" data-width="1080" data-height="1920">

    <script>
